AWSTemplateFormatVersion: 2010-09-09
Description: Single EC2 instance launched into the existing Virginia VPC/subnet.

Mappings:
  '194031983094':
    eu-north-1:
      vpc: vpc-0cfaea453bc1dfdc2  
      Public1: subnet-071b5679f9077ee3f  
      Private1: subnet-03c254029a1aa340e  
      ami: ami-0aba19e56f3eaec05
      whami: ami-0f889675a97d02bc4
      keyname: sonny-bastion-key
      instanceType: t3.small
      volumeSize: 8

Resources:

  BastionHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows SSH access to this instance.
      VpcId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0 # temporariy

  BastionHostInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - instanceType
      KeyName: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - keyname
      ImageId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - ami
      SecurityGroupIds:
        - !Ref BastionHostSecurityGroup
      SubnetId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - Public1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
            VolumeSize: !FindInMap
              - !Ref AWS::AccountId
              - !Ref AWS::Region
              - volumeSize
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

  PHPSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PhpServer testing.
      VpcId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '443'
          ToPort: '443'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 16.0.0.0/16
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 16.0.1.0/24

  PHPWebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - instanceType
      KeyName: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - keyname
      ImageId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - ami
      SecurityGroupIds:
        - !Ref PHPSecurityGroup
      SubnetId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - Private1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
            VolumeSize: !FindInMap
              - !Ref AWS::AccountId
              - !Ref AWS::Region
              - volumeSize
      # NEW: Download index.html from GitHub when EC2 launches
      UserData: !Base64 |
        #!/bin/bash
        set -eux

        apt-get update -y
        apt-get install -y nginx curl

        curl --fail --location \
          --retry 5 \
          --retry-delay 5 \
          https://raw.githubusercontent.com/kyawsithuCloudDevOp/Test/master/index.html \
          -o /var/www/html/index.html

        systemctl enable nginx
        systemctl restart nginx
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-phpweb
        - Key: Owner
          Value: DevOps
        - Key: Application
          Value: PHPWeb
        - Key: SystemTag
          Value: PHPWeb
        - Key: Security
          Value: PHPWeb
        - Key: Environment
          Value: Sandbox

  WindowSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for WIndows Server instance.
      VpcId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3389
          ToPort: 3389
          SourceSecurityGroupId: !GetAtt BastionHostSecurityGroup.GroupId

  WindowServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - instanceType
      KeyName: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - keyname
      ImageId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - whami
      SecurityGroupIds:
        - !Ref WindowSecurityGroup
      SubnetId: !FindInMap
        - !Ref AWS::AccountId
        - !Ref AWS::Region
        - Private1
      EbsOptimized: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            DeleteOnTermination: true
            VolumeSize: 30
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-windowweb
        - Key: Owner
          Value: DevOps
        - Key: Application
          Value: WindowWeb
        - Key: SystemTag
          Value: WindowWeb
        - Key: Security
          Value: WindowWeb
        - Key: Environment
          Value: Sandbox

Outputs:
  InstanceId:
    Value: !Ref BastionHostInstance
  PublicIp:
    Value: !GetAtt BastionHostInstance.PublicIp
